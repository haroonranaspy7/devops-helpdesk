grafana:
  enabled: true

  adminPassword: helpdesk-grafana-admin

  service:
    type: ClusterIP

  resources:
    requests:
      cpu: 100m
      memory: 128Mi

    limits:
      cpu: 500m
      memory: 512Mi

prometheus:
  enabled: true

  prometheusSpec:
    retention: 7d

    resources:
      requests:
        cpu: 200m
        memory: 512Mi

      limits:
        cpu: 1000m
        memory: 1Gi

alertmanager:
  enabled: true

  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

      limits:
        cpu: 200m
        memory: 256Mi

kubeStateMetrics:
  enabled: true

prometheus-node-exporter:
  enabled: true
