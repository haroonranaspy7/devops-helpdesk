apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: standard
provisioner: rancher.io/local-path
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helpdesk-web
  namespace: helpdesk
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.middlewares: helpdesk-redirect-to-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - helpdeskflow.site
      secretName: helpdeskflow-tls
  rules:
    - host: 18-210-115-168.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: helpdesk-web
                port:
                  number: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: helpdesk
spec:
  redirectScheme:
    scheme: https
    permanent: true
