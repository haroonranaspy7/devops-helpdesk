name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: helpdesk_test_db
          POSTGRES_USER: helpdesk_user
          POSTGRES_PASSWORD: helpdesk_test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U helpdesk_user -d helpdesk_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://helpdesk_user:helpdesk_test_password@localhost:5432/helpdesk_test_db
      SECRET_KEY: github-actions-test-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: |
          python -m py_compile \
            app/__init__.py \
            app/auth.py \
            app/auth_utils.py \
            app/routes.py \
            app/models/ticket.py \
            app/models/user.py \
            run.py

      - name: Check JavaScript syntax
        run: |
          node --check static/js/app.js
          node --check static/js/settings.js

      - name: Run automated tests
        run: pytest

      - name: Build Docker image
        run: |
          docker build \
            --tag devops-helpdesk:${{ github.sha }} \
            .
