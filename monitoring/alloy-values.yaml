alloy:
  configMap:
    create: true

    content: |-
      logging {
        level  = "info"
        format = "logfmt"
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = [
            "__meta_kubernetes_namespace",
          ]

          target_label = "namespace"
        }

        rule {
          source_labels = [
            "__meta_kubernetes_pod_name",
          ]

          target_label = "pod"
        }

        rule {
          source_labels = [
            "__meta_kubernetes_pod_container_name",
          ]

          target_label = "container"
        }

        rule {
          source_labels = [
            "__meta_kubernetes_pod_label_app",
          ]

          target_label = "app"
        }

        rule {
          source_labels = [
            "__meta_kubernetes_pod_node_name",
          ]

          target_label = "node"
        }
      }

      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [
          loki.process.pod_logs.receiver,
        ]
      }

      loki.process "pod_logs" {
        stage.static_labels {
          values = {
            cluster = "docker-desktop",
          }
        }

        stage.json {
          expressions = {
            event  = "event",
            level  = "level",
            status = "status",
          }
        }

        stage.labels {
          values = {
            event = "",
            level = "",
          }
        }

        forward_to = [
          loki.write.default.receiver,
        ]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }

  resources:
    requests:
      cpu: 50m
      memory: 128Mi

    limits:
      cpu: 300m
      memory: 384Mi

controller:
  type: daemonset

serviceAccount:
  create: true

rbac:
  create: true
